name: 'Auto-assign PRs'

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user ? pr.user.login : '';
            // Skip bot-authored PRs (e.g. dependabot, github-actions) to prevent notification fatigue
            if (author.endsWith('[bot]') || author === 'dependabot' || author === 'github-actions') {
              core.info(`Skipping auto-assignment for bot-authored PR from ${author}`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = pr.number;

            // Get repo owner (first admin)
            const { data: repoData } = await github.rest.repos.get({ owner, repo });
            const repoOwner = repoData.owner.login;

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: pr_number,
              assignees: [repoOwner]
            });
