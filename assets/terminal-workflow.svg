  <!-- Terminal Body -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13">
    <text x="36" y="95" fill="#58a6ff">$ python -c "from accounts_core import AccountStore, publish_transit_projection, __version__"</text>
    <text x="36" y="117" fill="#8b949e"># 1. Initialize store on existing consumer DB (INV-ACC-01: 0 new tables created)</text>
    <text x="36" y="139" fill="#e6edf3">&gt;&gt;&gt; store = AccountStore("finance.db")</text>
    <text x="36" y="161" fill="#e6edf3">&gt;&gt;&gt; store.create_account("Girokonto", bank_name="Sparkasse", iban="DE89370400440532013000", bic="COBADEFFXXX")</text>
    <text x="36" y="183" fill="#7ee787">1</text>

    <text x="36" y="213" fill="#8b949e"># 2. Idempotent CAMT balance persistence by normalized IBAN (INV-ACC-07)</text>
    <text x="36" y="235" fill="#e6edf3">&gt;&gt;&gt; store.persist_camt_balances([{"iban": "DE89370400440532013000", "balance": 5420.50, "currency": "EUR", "date": "2026-09-15"}])</text>
    <text x="36" y="257" fill="#7ee787">['[OK] Konto DE89370400440532013000: Saldo 5420.50 EUR zum 2026-09-15 aktualisiert.']</text>

    <text x="36" y="287" fill="#8b949e"># 3. Strict 5-field allowlist &amp; masked IBAN projection (INV-ACC-02, INV-ACC-03)</text>
    <text x="36" y="309" fill="#e6edf3">&gt;&gt;&gt; store.transit_projection()</text>
    <text x="36" y="331" fill="#a5d6ff">[{'name': 'Girokonto', 'account_type': 'girokonto', 'balance': 5420.5,</text>
    <text x="36" y="351" fill="#a5d6ff">  'balance_date': '2026-09-15', 'iban_masked': '******************3000'}]</text>

    <text x="36" y="381" fill="#8b949e"># 4. Atomic read-only SQLite snapshot publisher (INV-ACC-05, INV-ACC-06)</text>
    <text x="36" y="403" fill="#e6edf3">&gt;&gt;&gt; publish_transit_projection("finance.db", "transit/accounts.sqlite", "state/chk.json", publisher_instance="bach-primary")</text>
    <text x="36" y="425" fill="#7ee787">{'status': 'published-read-only-projection', 'contract_id': 'org.ellmos.accounts.balance-projection',</text>
    <text x="36" y="445" fill="#7ee787"> 'contract_version': '1.0.0', 'source_checkpoint': 1, 'record_count': 1, 'complete_snapshot': True}</text>

    <text x="36" y="478" fill="#58a6ff">$ python -m pytest -ra -v &amp;&amp; python -m ruff check src tests</text>
    <text x="36" y="500" fill="#3fb950">PASS: 85 passed, 8 skipped (CI) | 93 passed (local) | ruff: All checks passed | 0 runtime deps</text>
