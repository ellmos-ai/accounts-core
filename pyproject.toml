[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accounts-core"
version = "0.1.1"
description = "Neutral domain core for the account/bank-balance domain: bank account CRUD, CAMT balance import, and a privacy-safe read-only transit projection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Lukas Geiger"}]
dependencies = []
keywords = ["accounts", "bank-accounts", "camt", "sqlite", "local-first", "bach", "ocean"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/accounts-core"
Repository = "https://github.com/ellmos-ai/accounts-core"
Documentation = "https://github.com/ellmos-ai/accounts-core#readme"
Issues = "https://github.com/ellmos-ai/accounts-core/issues"
Changelog = "https://github.com/ellmos-ai/accounts-core/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/accounts-core/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -v"

[tool.ruff]
line-length = 120
target-version = "py310"
