[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accounts-core"
version = "0.1.4"
description = "Neutral domain core for the account/bank-balance domain: bank account CRUD, CAMT balance import, and a privacy-safe read-only transit projection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt", "CONTRIBUTING.md"]
authors = [{name = "Lukas Geiger"}]
dependencies = []
keywords = [
  "accounts",
  "bank-accounts",
  "banking",
  "camt",
  "camt-053",
  "sqlite",
  "local-first",
  "offline-first",
  "bach",
  "open-ocean",
  "financial-primitives",
  "iban-validation",
  "iban-masking",
  "privacy-by-design",
  "zero-egress",
  "runasinvoker",
  "ellmos-ai",
  "open-bricks",
  "data-minimization",
  "fintech",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/accounts-core"
Repository = "https://github.com/ellmos-ai/accounts-core"
Documentation = "https://github.com/ellmos-ai/accounts-core#readme"
Issues = "https://github.com/ellmos-ai/accounts-core/issues"
Changelog = "https://github.com/ellmos-ai/accounts-core/blob/main/CHANGELOG.md"
Contributing = "https://github.com/ellmos-ai/accounts-core/blob/main/CONTRIBUTING.md"
Security = "https://github.com/ellmos-ai/accounts-core/blob/main/SECURITY.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/accounts-core/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://raw.githubusercontent.com/ellmos-ai/accounts-core/main/THIRD_PARTY_LICENSES.txt"
"Plain-Text Licenses" = "https://raw.githubusercontent.com/ellmos-ai/accounts-core/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://raw.githubusercontent.com/ellmos-ai/accounts-core/main/THIRD_PARTY_LICENSES.txt"
Notice = "https://github.com/ellmos-ai/accounts-core/blob/main/NOTICE"
"LLM Ready" = "https://raw.githubusercontent.com/ellmos-ai/accounts-core/main/llms.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -v --basetemp=.pytest_temp"
norecursedirs = [".git", ".pytest_cache", ".pytest_temp", "__pycache__", "build", "dist", ".venv", "venv", ".hypothesis", ".turbo", ".nyc_output", ".tox"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "SIM", "C4", "RUF"]
ignore = []
